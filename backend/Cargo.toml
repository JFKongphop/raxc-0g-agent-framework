[package]
name = "raxc"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "api"
path = "src/api.rs"

[[bin]]
name = "api_step9_9"
path = "src/api_step9_9.rs"

[dependencies]
tokio          = { version = "1",    features = ["full"] }
reqwest        = { version = "0.11", features = ["json"] }
serde          = { version = "1",    features = ["derive"] }
serde_json     = "1"
dotenv         = "0.15"
regex          = "1"
chrono         = { version = "0.4",  features = ["clock"] }
anyhow         = "1"
urlencoding    = "2"
axum           = { version = "0.7", features = ["macros"] }
tower-http     = { version = "0.5", features = ["cors"] }
ethers         = { version = "2.0", features = ["abigen", "ws"] }
hex            = "0.4"
base64         = "0.21"
tempfile       = "3"
async-trait    = "0.1"
futures        = "0.3"
md5            = "0.7"

